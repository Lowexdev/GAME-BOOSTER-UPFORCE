name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair o projeto do project.zip
        run: |
          mkdir -p proj
          unzip -o project.zip -d proj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Compilar
        run: gradle -p proj assembleDebug --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: GameLauncher-APK
          path: proj/app/build/outputs/apk/debug/*.apk
